# Checks every PR and every staging push. A staging push also builds the arm64 image and, once checks pass,
# deploys it to test.foosballcup.webbies.dev by writing the tag to loom.
# Flow: https://loom.webbies.dev/operations/staging-to-prod-promotion/
name: ci

on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths-ignore: [ '**.md', 'docs/**' ]
  push:
    branches: [ staging ]
    paths-ignore: [ '**.md', 'docs/**' ]

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/webb1es/foosballcup

jobs:
  test:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  web:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Audit
        run: npm audit --audit-level=high
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  build-staging:
    needs: [ test, web ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Compute image tag
        id: tag
        run: echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Layer cache lives in GHCR, not the Actions cache, which is capped at 10 GB per repo.
      - name: Build and push (linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

  deploy-staging:
    needs: [ build-staging ]
    runs-on: ubuntu-24.04
    concurrency:
      group: loom-tag-write-staging
      cancel-in-progress: false
    steps:
      - name: Mint loom installation token
        id: loom-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.LOOM_APP_ID }}
          private-key: ${{ secrets.LOOM_APP_PRIVATE_KEY }}
          owner: webb1es
          repositories: loom
      - name: Checkout loom
        uses: actions/checkout@v7
        with:
          repository: webb1es/loom
          token: ${{ steps.loom-token.outputs.token }}
          path: loom
      - name: Write staging image tag to loom
        working-directory: loom
        env:
          NEW_TAG: ${{ needs.build-staging.outputs.tag }}
        run: |
          set -euo pipefail
          FILE=workloads/foosballcup/overlays/staging/kustomization.yaml
          sed -i -E "s/^(    newTag:).*/\1 ${NEW_TAG}/" "$FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "deploy(foosballcup): ${NEW_TAG} to staging"
          for i in 1 2 3; do
            git push && break
            git pull --rebase
            sleep 2
          done
